services:
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_PACKAGE: "@practicallab/web"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP_PACKAGE: "@practicallab/admin"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file:
      - .env
    command: python apps/api/manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health/ready', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-practicallab_dev}
      POSTGRES_USER: ${DB_USER:-practicallab_dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
