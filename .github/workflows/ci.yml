name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Python dependencies
        run: python -m pip install -r apps/api/requirements-dev.txt
      - name: Lint and format checks
        run: |
          npm run lint
          npm run format:check
          python -m ruff check apps/api
          python -m black --check apps/api
      - name: Type checks
        run: npm run typecheck
      - name: Test
        env:
          DJANGO_SECRET_KEY: ci-only-not-for-deployment
          DJANGO_DEBUG: "1"
        run: |
          npm test
          python -m pytest apps/api
          python apps/api/manage.py check
      - name: Build
        run: npm run build
      - name: Dependency vulnerability checks
        run: |
          npm audit --audit-level=high
          python -m pip_audit -r apps/api/requirements.txt
