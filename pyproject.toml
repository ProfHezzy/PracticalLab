[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["apps/api"]
pythonpath = ["apps/api"]

[tool.pytest_env]
DJANGO_SECRET_KEY = "unit-test-only-not-for-deployment"
DJANGO_DEBUG = "1"
